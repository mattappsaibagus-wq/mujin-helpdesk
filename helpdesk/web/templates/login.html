{% extends "base.html" %}
{% block title %}Sign in — ITSS PRO TOOL{% endblock %}
{% block content %}
<div class="login-wrap">
    <form class="login-card" method="post" action="/login">
        <div class="eyebrow">Internal access</div>
        <h1>ITSS PRO TOOL</h1>
        <p>Enter the shared access code to open the troubleshooting console.</p>
        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}
        <div class="field">
            <label for="password">Access code</label>
            <input id="password" name="password" type="password" autofocus required autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Enter console</button>
    </form>
</div>
{% endblock %}
