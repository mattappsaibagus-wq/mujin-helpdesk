<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ITSS PRO TOOL{% endblock %}</title>
    <meta name="description" content="ITSS PRO TOOL — IT troubleshooting console for Debian 13, Windows 11, and macOS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">IT</span>
            <span class="brand-name">ITSS <span>PRO</span> TOOL</span>
        </a>
        {% if session.get('authenticated') %}
        <nav class="nav-links" aria-label="Main">
            <a href="/">Console</a>
            <a href="/browse/debian">Debian</a>
            <a href="/browse/windows">Windows</a>
            <a href="/browse/mac">macOS</a>
            <a href="/ticket">New ticket</a>
            <a href="/tickets">Saved</a>
            <form method="post" action="/logout" style="display:inline">
                <button class="linkish" type="submit">Sign out</button>
            </form>
        </nav>
        {% endif %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>ITSS PRO TOOL — internal IT troubleshooting console</span>
        <span>Debian 13 · Windows 11 · macOS</span>
    </footer>
    <script src="/static/app.js" defer></script>
</body>
</html>
